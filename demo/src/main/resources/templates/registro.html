<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta de cliente | P&amp;D Real Estate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #101116; color: #e5e7eb; }
    .register-panel { width: min(100% - 2rem, 34rem); margin: 8vh auto; padding: 2.5rem;
      border: 1px solid rgba(255,255,255,.1); border-radius: 1.25rem; background: #17181e; }
  </style>
</head>
<body>
<main class="register-panel">
  <a th:href="@{/login}">← Volver al acceso</a>
  <h1 class="h3 mt-4">Crear cuenta de cliente</h1>
  <p class="text-secondary">Esta solicitud crea una cuenta CLIENTE. El rol ADMIN solo lo asigna el sistema.</p>
  <form method="post" th:action="@{/registro}" th:object="${registroForm}">
    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre completo</label>
      <input class="form-control" id="nombre" required th:field="*{nombre}">
      <div class="text-danger small" th:errors="*{nombre}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="correo">Correo electrónico</label>
      <input class="form-control" id="correo" type="email" required th:field="*{correo}">
      <div class="text-danger small" th:errors="*{correo}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Contraseña (mínimo 12 caracteres)</label>
      <input class="form-control" id="password" type="password" minlength="12" required th:field="*{password}">
      <div class="text-danger small" th:errors="*{password}"></div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
      <input class="form-control" id="confirmarPassword" type="password" minlength="12" required th:field="*{confirmarPassword}">
      <div class="text-danger small" th:errors="*{confirmarPassword}"></div>
    </div>
    <button class="btn btn-warning w-100 fw-semibold" type="submit">Crear cuenta</button>
  </form>
</main>
</body>
</html>
