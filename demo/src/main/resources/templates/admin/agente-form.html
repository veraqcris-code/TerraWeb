<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente | Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;background:#101116;color:#e7e5e4}.form-panel{max-width:42rem;margin:3rem auto;padding:2rem;background:#17181e;border:1px solid #303139;border-radius:1rem}.form-label{color:#f3c66b}</style>
</head>
<body>
<main class="container form-panel">
  <a th:href="@{/admin#agentes}">← Volver al panel</a>
  <h1 class="h3 my-4" th:text="${agenteId == null ? 'Nuevo agente' : 'Editar agente'}">Agente</h1>
  <form method="post" th:action="@{${formAction}}" th:object="${agenteForm}">
    <div class="mb-3"><label class="form-label" for="nombre">Nombre *</label><input class="form-control" id="nombre" required th:field="*{nombre}"><div class="text-danger small" th:errors="*{nombre}"></div></div>
    <div class="mb-3"><label class="form-label" for="cargo">Cargo *</label><input class="form-control" id="cargo" required th:field="*{cargo}"><div class="text-danger small" th:errors="*{cargo}"></div></div>
    <div class="mb-3"><label class="form-label" for="fotoUrl">URL de foto</label><input class="form-control" id="fotoUrl" th:field="*{fotoUrl}"></div>
    <div class="mb-3"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" th:field="*{telefono}"></div>
    <div class="mb-3"><label class="form-label" for="whatsapp">WhatsApp (código país + número)</label><input class="form-control" id="whatsapp" th:field="*{whatsapp}"></div>
    <div class="form-check mb-4"><input class="form-check-input" id="activo" type="checkbox" th:field="*{activo}"><label class="form-check-label" for="activo">Agente activo</label></div>
    <div class="d-flex gap-2"><button class="btn btn-warning fw-semibold" type="submit">Guardar agente</button><a class="btn btn-outline-light" th:href="@{/admin#agentes}">Cancelar</a></div>
  </form>
</main>
</body>
</html>
