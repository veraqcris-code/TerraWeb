<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propiedad | Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;background:#101116;color:#e7e5e4}.form-panel{max-width:58rem;margin:3rem auto;padding:2rem;background:#17181e;border:1px solid #303139;border-radius:1rem}.form-label{color:#f3c66b}</style>
</head>
<body>
<main class="container form-panel">
  <a th:href="@{/admin#propiedades}">← Volver al panel</a>
  <h1 class="h3 my-4" th:text="${propiedadId == null ? 'Nueva propiedad' : 'Editar propiedad'}">Propiedad</h1>
  <form method="post" th:action="@{${formAction}}" th:object="${propiedadForm}">
    <div class="row g-3">
      <div class="col-12"><label class="form-label" for="titulo">Título *</label><input class="form-control" id="titulo" required th:field="*{titulo}"><div class="text-danger small" th:errors="*{titulo}"></div></div>
      <div class="col-md-6"><label class="form-label" for="precio">Precio *</label><input class="form-control" id="precio" min="0.01" step="0.01" type="number" required th:field="*{precio}"><div class="text-danger small" th:errors="*{precio}"></div></div>
      <div class="col-md-3"><label class="form-label" for="moneda">Moneda</label><select class="form-select" id="moneda" th:field="*{moneda}"><option value="PEN">PEN</option><option value="USD">USD</option></select></div>
      <div class="col-md-3"><label class="form-label" for="modalidad">Modalidad</label><select class="form-select" id="modalidad" th:field="*{modalidad}"><option value="Venta">Venta</option><option value="Alquiler">Alquiler</option></select></div>
      <div class="col-md-6"><label class="form-label" for="direccion">Dirección</label><input class="form-control" id="direccion" th:field="*{direccion}"></div>
      <div class="col-md-3"><label class="form-label" for="distrito">Distrito</label><input class="form-control" id="distrito" th:field="*{distrito}"></div>
      <div class="col-md-3"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" th:field="*{ciudad}"></div>
      <div class="col-md-3"><label class="form-label" for="habitaciones">Habitaciones</label><input class="form-control" id="habitaciones" min="0" type="number" th:field="*{habitaciones}"></div>
      <div class="col-md-3"><label class="form-label" for="banos">Baños</label><input class="form-control" id="banos" min="0" type="number" th:field="*{banos}"></div>
      <div class="col-md-3"><label class="form-label" for="areaConstruida">Área construida (m²)</label><input class="form-control" id="areaConstruida" min="0" step="0.01" type="number" th:field="*{areaConstruida}"></div>
      <div class="col-md-3"><label class="form-label" for="areaTotal">Área total (m²)</label><input class="form-control" id="areaTotal" min="0" step="0.01" type="number" th:field="*{areaTotal}"></div>
      <div class="col-md-6"><label class="form-label" for="estado">Estado comercial</label><select class="form-select" id="estado" th:field="*{estado}"><option value="DISPONIBLE">Disponible</option><option value="RESERVADA">Reservada</option><option value="EN_REVISION">En revisión</option><option value="VENDIDA">Vendida</option><option value="RETIRADA">Retirada</option></select></div>
      <div class="col-md-6"><label class="form-label" for="agenteId">Agente asignado</label><select class="form-select" id="agenteId" th:field="*{agenteId}"><option value="">Sin asignar</option><option th:each="agente : ${agentes}" th:value="${agente.id}" th:text="${agente.nombre}"></option></select></div>
      <div class="col-12"><label class="form-label" for="imagenPrincipalUrl">URL de imagen principal</label><input class="form-control" id="imagenPrincipalUrl" placeholder="/images/propiedades/casa.jpg" th:field="*{imagenPrincipalUrl}"><small class="text-secondary">Para archivos locales usa una URL pública, por ejemplo /images/propiedades/casa.jpg.</small></div>
      <div class="col-md-6"><label class="form-label" for="textoAlternativo">Texto alternativo</label><input class="form-control" id="textoAlternativo" th:field="*{textoAlternativo}"></div>
      <div class="col-md-6"><label class="form-label" for="etiquetaImagen">Etiqueta de imagen</label><input class="form-control" id="etiquetaImagen" th:field="*{etiquetaImagen}"></div>
      <div class="col-12"><label class="form-label" for="descripcion">Descripción</label><textarea class="form-control" id="descripcion" rows="4" th:field="*{descripcion}"></textarea></div>
      <div class="col-12 form-check ms-2"><input class="form-check-input" id="publicada" type="checkbox" th:field="*{publicada}"><label class="form-check-label" for="publicada">Publicar en el sitio</label></div>
    </div>
    <div class="d-flex gap-2 mt-4"><button class="btn btn-warning fw-semibold" type="submit">Guardar propiedad</button><a class="btn btn-outline-light" th:href="@{/admin#propiedades}">Cancelar</a></div>
  </form>
</main>
</body>
</html>
