<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso privado | P&amp;D Real Estate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/vistas.html/css/login.css}">
  <style>
    .auth-panel { width: min(100% - 2rem, 30rem); margin: 8vh auto; padding: 2.5rem;
      border: 1px solid rgba(255,255,255,.1); border-radius: 1.25rem; background: #17181e; }
    .auth-panel h1 { color: #f3c66b; }
    .auth-panel label { color: #e5e7eb; }
  </style>
</head>
<body>
<main class="auth-panel">
  <a class="back-link" th:href="@{/}">← Volver al sitio</a>
  <div class="text-center my-4">
    <div class="header-logo-badge mx-auto mb-3"><span>P&amp;D</span></div>
    <h1 class="h3">Portal privado</h1>
    <p class="text-secondary">Acceso para clientes y administradores.</p>
  </div>

  <div class="alert alert-danger" role="alert" th:if="${param.error}">
    No se pudo iniciar sesión. Verifica el correo y la contraseña.
  </div>
  <div class="alert alert-success" role="status" th:if="${param.logout}">
    Cerraste sesión correctamente.
  </div>
  <div class="alert alert-success" role="status" th:if="${registroExitoso}">
    Cuenta de cliente creada. Ya puedes iniciar sesión.
  </div>

  <form method="post" th:action="@{/login}">
    <div class="mb-3">
      <label class="form-label" for="username">Correo electrónico</label>
      <input class="form-control" id="username" name="username" type="email"
             autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-control" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" id="remember-me" name="remember-me" type="checkbox">
      <label class="form-check-label" for="remember-me">Recordarme en este equipo</label>
    </div>
    <button class="btn btn-warning w-100 fw-semibold" type="submit">Ingresar</button>
  </form>
  <p class="text-center text-secondary mt-4 mb-0">
    ¿Eres cliente nuevo? <a th:href="@{/registro}">Crear cuenta de cliente</a>
  </p>
</main>
</body>
</html>
