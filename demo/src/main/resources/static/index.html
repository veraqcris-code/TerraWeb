<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Inmuebles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <div class="logo">🏠 Logo</div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Search</a>
            <a href="#">Agents</a>
            <a href="#">About</a>
        </nav>
        <button class="btn-login">Log In</button>
        <button class="btn-register">Register</button>
        
    </header>

    
    <section class="hero">
        <div class="hero-image">
            
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=500" alt="Casa moderna">
        </div>
        <div class="hero-content">
            <h1>FIND YOUR<br>DREAM HOME</h1>
            <div class="search-bar">
                <input type="text" placeholder="Location">
                <span class="divider">▪</span>
                <select><option>Price Range</option></select>
                <span class="divider">.</span>
                <select><option>Property Type</option></select>
                <button class="btn-search">Search</button>
            </div>
        </div>
    </section>

    <div class="section-divider"></div>

    
    <section class="featured-properties">
        <h2>FEATURED PROPERTIES</h2>
        <div class="properties-grid" id="properties-container">
            
        </div>
        <div class="view-all-container">
            <button class="btn-view-all">View All</button>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
