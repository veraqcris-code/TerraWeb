<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Dream Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <header>
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#fbd34d"><path d="M12 3L4 9V21H20V9L12 3ZM10 19V13H14V19H10Z"/></svg>
        </div>
        <nav>
            <a href="index.html" class="back-link">← Volver al Inicio</a>
        </nav>
    </header>
    <div class="header-line"></div>

    <div class="login-container">
        <div class="login-box">
            <h2>INICIAR SESIÓN</h2>
            <form>
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="tucorreo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
