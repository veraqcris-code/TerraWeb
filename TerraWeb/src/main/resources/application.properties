spring.application.name=TerraWeb

# Configuración de Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/terraweb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Base de datos - usar variables de entorno en producción
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:soldepiura}

# Configuración de JPA / Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# SQL logging - activar solo en desarrollo (ver application-dev.properties)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=160MB

app.admin.email=${ADMIN_EMAIL:}
app.uploads.directory=${TERRAWEB_UPLOADS_DIR:${user.home}/terraweb/uploads}
app.admin.password=${ADMIN_PASSWORD:}
